apply plugin: 'com.android.application'

android {
    namespace 'com.openew.monster.ttzzbx32.hook'
    compileSdk 34

    defaultConfig {
        applicationId 'com.openew.monster.ttzzbx32.hook'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Xposed / LSPosed API is provided at runtime by the framework; compileOnly only.
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'
}
